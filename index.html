<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dental Malpractice Case Explorer & Insurance Lifecycle</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #0284c7;
      --accent-light: #e0f2fe;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --warning-light: #fef3c7;
      --success: #059669;
      --success-light: #d1fae5;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; background: var(--card); border-radius: 14px; box-shadow: 0 10px 25px rgba(15,23,42,0.06); border: 1px solid var(--border); overflow: hidden; }
    
    /* Header */
    .header { background: var(--primary); color: #fff; padding: 20px 28px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .header p { font-size: 0.85rem; color: #94a3b8; }
    .badge-payout { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; color: #38bdf8; }

    /* Case Tabs */
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: #f1f5f9; border-bottom: 1px solid var(--border); }
    .tab-btn { padding: 14px 10px; border: none; background: transparent; cursor: pointer; font-size: 0.82rem; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; transition: all 0.2s; text-align: center; }
    .tab-btn:hover { color: var(--primary); background: #e2e8f0; }
    .tab-btn.active { color: var(--accent); background: var(--card); border-bottom-color: var(--accent); }
    .tab-btn span { display: block; font-size: 0.72rem; font-weight: 500; color: var(--muted); margin-top: 2px; }

    /* Lifecycle Stepper */
    .stepper-wrap { padding: 22px 28px 16px; border-bottom: 1px solid var(--border); background: #fcfcfd; }
    .stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .step-node { padding: 12px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--card); cursor: pointer; transition: all 0.2s; position: relative; }
    .step-node:hover { border-color: #94a3b8; }
    .step-node.active { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 4px 12px rgba(2,132,199,0.12); }
    .step-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .step-node.active .step-num { color: var(--accent); }
    .step-label { font-size: 0.84rem; font-weight: 700; color: var(--primary); }

    /* Main Content Area */
    .content { padding: 26px 28px; display: grid; grid-template-columns: 1.35fr 1fr; gap: 24px; min-height: 330px; }
    .stage-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .stage-tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; background: var(--accent-light); color: var(--accent); }
    .stage-title { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
    .stage-desc { font-size: 0.94rem; color: #334155; margin-bottom: 16px; }
    .bullet-list { list-style: none; space-y: 8px; }
    .bullet-list li { position: relative; padding-left: 20px; font-size: 0.88rem; color: #334155; margin-bottom: 8px; }
    .bullet-list li::before { content: "•"; position: absolute; left: 5px; color: var(--accent); font-weight: bold; }

    /* Role & Insurance Breakdown */
    .side-panel { display: flex; flex-direction: column; gap: 14px; }
    .role-box { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--card); }
    .role-box h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin-bottom: 6px; }
    .role-box p { font-size: 0.86rem; color: var(--primary); font-weight: 500; }
    .role-box.takeaway { background: var(--warning-light); border-color: #fde68a; }
    .role-box.takeaway h4 { color: var(--warning); }
    .role-box.insurance { background: #f0fdf4; border-color: #bbf7d0; }
    .role-box.insurance h4 { color: var(--success); }

    /* Footer Controls */
    .footer { padding: 16px 28px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .nav-btns { display: flex; gap: 10px; }
    .btn { padding: 9px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--primary); transition: all 0.15s; }
    .btn:hover:not(:disabled) { background: #f1f5f9; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.primary:hover:not(:disabled) { background: #0369a1; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .progress-text { font-size: 0.82rem; color: var(--muted); font-weight: 500; }

    @media (max-width: 768px) {
      .tabs, .stepper { grid-template-columns: 1fr; }
      .content { grid-template-columns: 1fr; }
    }
  </style>
</head>

    let currentCase = 0;
    let currentStep = 0;

    function init() {
      const tabsEl = document.getElementById("case-tabs");
      tabsEl.innerHTML = cases.map((c, idx) => `
        <button class="tab-btn ${idx === 0 ? 'active' : ''}" onclick="selectCase(${idx})">
          ${c.shortTitle}
          <span>${c.subLabel}</span>
        </button>
      `).join("");
      render();
    }

    function selectCase(idx) {
      currentCase = idx;
      currentStep = 0;
      document.querySelectorAll(".tab-btn").forEach((btn, i) => {
        btn.classList.toggle("active", i === idx);
      });
      render();
    }

    function selectStep(idx) {
      currentStep = idx;
      render();
    }

    function changeStep(delta) {
      const next = currentStep + delta;
      if (next >= 0 && next < 5) {
        currentStep = next;
        render();
      }
    }

    function render() {
      const c = cases[currentCase];
      const s = c.steps[currentStep];

      document.getElementById("case-title").textContent = c.title;
      document.getElementById("case-subtitle").textContent = c.subtitle;
      document.getElementById("case-payout").textContent = c.payout;

      const stepperEl = document.getElementById("stepper");
      stepperEl.innerHTML = c.steps.map((st, i) => `
        <div class="step-node ${i === currentStep ? 'active' : ''}" onclick="selectStep(${i})">
          <div class="step-num">Step ${i + 1}</div>
          <div class="step-label">${st.label.replace(/^[0-9]+\.\s*/, '')}</div>
        </div>
      `).join("");

      document.getElementById("stage-tag").textContent = `Stage ${currentStep + 1} of 5 • ${s.label}`;
      document.getElementById("stage-heading").textContent = s.heading;
      document.getElementById("stage-summary").textContent = s.summary;
      document.getElementById("stage-bullets").innerHTML = s.bullets.map(b => `<li>${b}</li>`).join("");

      document.getElementById("role-text").textContent = c.role;
      document.getElementById("ins-text").textContent = c.insurance;
      document.getElementById("takeaway-text").textContent = c.takeaway;

      document.getElementById("progress-label").textContent = `Viewing Case ${currentCase + 1}, Stage ${currentStep + 1} of 5`;
      document.getElementById("prev-btn").disabled = currentStep === 0;
      document.getElementById("next-btn").disabled = currentStep === 4;
    }

    init();
  </script>
</body>
</html>
